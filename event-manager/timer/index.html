<html lang="en">

<title>startup48 · Pitch Timer</title>
<!--
  Self-contained pitch timer: no external files, ES5 JavaScript.
  Keys: Space start/pause · R reset · 1/2/3 presets (not while running) · F fullscreen · M mute · H hide controls
  URL presets: ?d=300&w=60,20&label=Pitch  (seconds)
-->
<style>
  /* Brand fonts come from ../assets/fonts when deployed with the other tools;
     if missing (timer copied on its own) the system fonts below take over. */
  @font-face { font-family: "Poppins"; font-weight: 700; font-display: swap; src: url("../assets/fonts/poppins-700.woff2") format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 800; font-display: swap; src: url("../assets/fonts/poppins-800.woff2") format("woff2"); }
  @font-face { font-family: "Raleway"; font-weight: 100 900; font-display: swap; src: url("../assets/fonts/raleway-variable.woff2") format("woff2"); }
  @font-face { font-family: "Ubuntu"; font-weight: 500; font-display: swap; src: url("../assets/fonts/ubuntu-500.woff2") format("woff2"); }
  html, body { margin: 0; height: 100%; }
  body {
    background: #1b3c52; color: #ffffff;
    font-family: "Ubuntu", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; -webkit-user-select: none; user-select: none;
    -webkit-transition: background-color .4s; transition: background-color .4s;
  }
  /* navy -> amber (first warning) -> brand orange (last warning) -> red (overtime) */
  body.warn1 { background: #b07a0c; }
  body.warn2 { background: #ee512b; }
  body.over { background: #9e1f14; }
  body.over.flash { background: #d0301d; }
  #app { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #label { position: absolute; top: 2vh; left: 0; right: 0; text-align: center; font-family: "Raleway", Arial, sans-serif; font-size: 4vh; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
  #brand { position: absolute; top: 2vh; left: 2vw; font-family: "Poppins", "Arial Black", Arial, sans-serif; font-weight: 800; font-size: 3vh; line-height: 1; text-transform: uppercase; white-space: nowrap; }
  #brand .mark { width: 1.3em; height: 1.3em; vertical-align: -0.32em; margin-right: .3em; }
  #time {
    position: absolute; left: 0; right: 0; top: 50%; text-align: center; line-height: 1;
    font-weight: 700; white-space: nowrap;
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums; -webkit-font-feature-settings: "tnum"; font-feature-settings: "tnum";
  }
  /* Fixed-width slot per digit: Poppins digits are proportional, so the time would shift each second. */
  #time .d { display: inline-block; width: .68em; text-align: center; }
  #next { position: absolute; left: 0; right: 0; bottom: 22vh; text-align: center; font-size: 3.2vh; opacity: .7; }
  #controls {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 1.5vh 2vw 2vh; text-align: center;
    background: rgba(0,0,0,.35);
  }
  body.hide-controls #controls { display: none; }
  body.hide-controls #next { bottom: 3vh; }
  body.hide-controls { cursor: none; }
  button, input { font: inherit; }
  button {
    margin: .4vh .3vw; padding: 1.2vh 1.6vw; font-size: 2.3vh; font-weight: 700;
    color: #ffffff; background: #2f617d; border: 2px solid transparent; border-radius: 8px; cursor: pointer;
  }
  button.on { border-color: #ffffff; }
  button.primary { background: #ee512b; color: #fff; min-width: 12vw; }
  body.warn2 button.primary { background: #ffffff; color: #ee512b; }
  .group { display: inline-block; margin: 0 1vw; vertical-align: middle; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  /* Options row, shown and hidden with the gear. */
  #opts { display: none; margin-top: .6vh; }
  body.show-opts #opts { display: block; }
  .group button { vertical-align: middle; }
  #gear { padding: 1.2vh 1vw; line-height: 0; }
  #gear svg { width: 2.8vh; height: 2.8vh; transition: transform .3s ease; }
  body.show-opts #gear { border-color: #ffffff; }
  body.show-opts #gear svg { transform: rotate(60deg); }
  #hint { font-size: 1.6vh; opacity: .55; margin-top: .6vh; }
  #endWrap { display: inline-block; margin: .4vh .6vw; font-size: 2.1vh; font-weight: 700; vertical-align: middle; }
  #endSound { font: inherit; font-weight: 700; font-size: 2vh; padding: .6vh .5vw; border-radius: 8px; border: 2px solid transparent; background: #2f617d; color: #ffffff; }

  #vol { width: 9vw; min-width: 90px; vertical-align: middle; accent-color: #ee512b; }
  #diag { position: absolute; left: 1vw; right: 1vw; bottom: 1vh; z-index: 5; padding: .6vh 1vw; font: 1.6vh/1.4 Menlo, Consolas, monospace; background: rgba(0,0,0,.75); color: #fff; border-radius: 6px; }

<script>
(function () {
  'use strict';

  var PRESETS = [
    { key: 'opening', label: 'Opening Pitch', duration: 60, tones: [{ at: 20, kind: 'warning' }, { at: 10, kind: 'danger' }] },
    { key: 'final', label: 'Final Pitch', duration: 300, tones: [{ at: 60, kind: 'warning' }, { at: 30, kind: 'danger' }] },
    { key: 'qa', label: 'Q&A', duration: 300, tones: [{ at: 60, kind: 'warning' }, { at: 30, kind: 'danger' }] }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var body = document.body;
  var timeEl = $('time');

  var cfg = null;          // active {label, duration, tones: [{at, kind}] latest-first, countUp}
  var presetIndex = -1;    // -1 = a timer from the URL (?d=…)
  var running = false;
  var endAt = 0;           // ms timestamp when remaining hits 0
  var remainingMs = 0;     // used while paused
  var fired = {};          // tones already sounded, by index; 'zero' for the final buzzer
  var muted = false;
  var tickHandle = null;
  var wakeLock = null;

  /* ---------- storage (optional) ---------- */
  function store(key, val) {
    try { if (val === undefined) { return window.localStorage.getItem('s48timer.' + key); } window.localStorage.setItem('s48timer.' + key, val); } catch (e) { }

  }

  /* ---------- audio ---------- */
  // Cues re-created from pitch-timer-tones.js (pitchtimer.com's warning / danger / end sounds).

  // through <audio> elements at the moment each cue is reached, as pitchtimer.com does. <audio> also
  // plays when an iPhone/iPad is on silent. Web Audio is used only if an <audio> element refuses.
  var CUE_RATE = 22050;     // ample for these sounds (highest partial 4.9 kHz)
  var END_GAIN = 0.75;      // level trim so the noise cue matches the original's loudness
  // End-of-time sounds the operator can choose from (first = default).
  var END_SOUNDS = [['bowl', 'Singing bowl'], ['airhorn', 'Air horn'], ['levelup', '8-bit level complete'], ['powerdown', 'Power-down sweep'], ['noise', 'Original noise burst']];
  var endSound = 'bowl';
  var volume = 0.8;
  var cues = {};            // sound -> { pcm: Float32Array, url: string, el: HTMLAudioElement|null, ready: bool }
  var unlocked = false;
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null;
  var diag = { path: '-', last: '-', error: '' };

  // type 'set' (jump), 'lin' or 'exp' (ramp from the previous point).
  function envelope(ev, n, rate) {

      var nx = ev[k + 1];

        var f = (t - ev[k][2]) / (nx[2] - ev[k][2]);

      }

  }

    var b0 = type === 'lowpass' ? (1 - cs) / 2 : (1 + cs) / 2, b1 = type === 'lowpass' ? 1 - cs : -(1 + cs), b2 = b0;

    for (var i = 0; i < x.length; i++) {

  function partial(out, start, f, amp, attack, tau, hold) {
    var r = CUE_RATE, s0 = Math.floor(start * r), w = 2 * Math.PI * f / r;

      var x = new Float32Array(Math.floor(4.4 * CUE_RATE));

    // Air horn: two blasts of three detuned sawtooth voices with a slight pitch scoop.

        for (var i = 0; i < n && s0 + i < x.length; i++) {

    powerdown: function () {
      var r = CUE_RATE, dur = 1.35, x = new Float32Array(Math.floor(dur * r)), ph = 0;

  function synth(name) {

  function getCue(name) {
    if (!cues[name]) {
      var pcm = synth(name), el = null, url = wavUrl(pcm, CUE_RATE);
      try { el = new Audio(); el.preload = 'auto'; el.src = url; if (el.load) { el.load(); } } catch (e) { el = null; }
      cues[name] = { pcm: pcm, url: url, el: el, ready: false };
    }
    return cues[name];
  }

  // The sounds the timer can play right now: both warnings and the chosen end sound.
  function buildCues() { getCue('warning'); getCue('danger'); getCue(endSound); }

  // Must run inside a click/tap/keypress: browsers (iOS especially) only allow sound to start
  // from a user gesture, so each <audio> element is played silently once to unlock it.
  function unlockAudio() {
    buildCues();
    unlocked = true;
    for (var key in cues) {
      if (!cues.hasOwnProperty(key) || cues[key].ready || !cues[key].el) { continue; }
      cues[key].ready = true;
      var el = cues[key].el;
      try {
        el.muted = true;
        var p = el.play();
        (function (el) {
          // Skip if a real cue has already claimed this element (playCue unmutes it first).
          var done = function () { if (el.muted) { try { el.pause(); el.currentTime = 0; } catch (e) { } el.muted = false; } };
          if (p && p.then) { p.then(done, function () { el.muted = false; }); } else { done(); }
        })(el);
      } catch (e) { el.muted = false; }
    }
    // Prepare the Web Audio fallback in the same gesture.
    if (AC && !ctx) {
      try {
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = volume;
        master.connect(ctx.destination);
        // iOS 17+: let Web Audio play even when the ringer switch is on silent.
        if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch (e) { } }
      } catch (e) { ctx = null; master = null; }
    }
    if (ctx && ctx.state === 'suspended' && ctx.resume) { try { ctx.resume(); } catch (e) { } }
    updateAudioNote();
  }

  function playWebAudio(name) {
    if (!ctx || !master) { return false; }
    try {
      var c = getCue(name), buf = ctx.createBuffer(1, c.pcm.length, CUE_RATE);
      if (buf.copyToChannel) { buf.copyToChannel(c.pcm, 0); } else { buf.getChannelData(0).set(c.pcm); }
      var src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(master);
      if (src.start) { src.start(0); } else { src.noteOn(0); }
      diag.path = 'Web Audio (' + ctx.state + ')';
      return true;
    } catch (e) {
      diag.error = 'Web Audio: ' + (e && e.name ? e.name : e);
      return false;
    }
  }

  function playCue(name) {
    var c = getCue(name), el = c.el;
    diag.last = name + ' at ' + new Date().toLocaleTimeString();
    if (!el) { playWebAudio(name); updateDiag(); return; }
    try {
      el.pause();
      el.currentTime = 0;
      el.muted = false;
      el.volume = volume;
      var p = el.play();
      diag.path = '<audio> element';
      if (p && p.then) {
        p.then(updateDiag, function (err) {
          // Refused (e.g. NotAllowedError when audio wasn't unlocked by a gesture): try Web Audio.
          diag.error = '<audio>: ' + (err && err.name ? err.name : err);
          playWebAudio(name);
          updateDiag();
        });
      }
    } catch (e) {
      diag.error = '<audio>: ' + (e && e.name ? e.name : e);
      playWebAudio(name);
    }
    updateDiag();
  }

  // Play a cue now, or `delay` seconds from now.
  function play(name, delay) {
    if (muted) { return; }
    if (name === 'end') { name = endSound; }
    if (delay) { setTimeout(function () { if (!muted) { playCue(name); } }, delay * 1000); } else { playCue(name); }
  }

  function setVolume(v) {
    volume = Math.max(0, Math.min(1, v));
    if (master) { master.gain.value = volume; }
    for (var k in cues) { if (cues.hasOwnProperty(k) && cues[k].el) { cues[k].el.volume = volume; } }
    $('vol').value = Math.round(volume * 100);
    store('volume', String(volume));
  }

  function updateAudioNote() {
    var note = $('audioNote');
    if (muted) {
      note.textContent = 'Sound is off — press M or the Sound button to turn it on';
      note.style.display = 'block';
    } else if (!unlocked) {
      note.textContent = 'Click anywhere or press a key to enable sound';
      note.style.display = 'block';
    } else {
      note.style.display = 'none';
    }
  }

  // Press D for an audio diagnostics line (which playback path is used, and any error).
  function updateDiag() {
    var d = $('diag');
    if (d.style.display === 'none') { return; }
    d.textContent = 'Audio: ' + diag.path + ' | unlocked: ' + (unlocked ? 'yes' : 'no') +
      ' | Web Audio: ' + (ctx ? ctx.state : (AC ? 'not started' : 'unsupported')) +
      ' | sound: ' + (muted ? 'off' : 'on') + ', volume ' + Math.round(volume * 100) + '%, end: ' + endSound +
      ' | last cue: ' + diag.last + (diag.error ? ' | last error: ' + diag.error : '');
  }

  /* ---------- time helpers ---------- */
  function fmt(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function now() { return new Date().getTime(); }

  function remaining() { return running ? endAt - now() : remainingMs; }

  /* ---------- display ---------- */
  function fitText() {
    var w = window.innerWidth, h = window.innerHeight;
    var chars = Math.max(4, timeEl.textContent.length);
    // tabular digits ~0.6em wide; leave room for label and controls
    var size = Math.min(w * 0.94 / (chars * 0.62), h * (body.className.indexOf('hide-controls') !== -1 ? 0.66 : 0.55));
    timeEl.style.fontSize = Math.floor(size) + 'px';
    timeEl.style.marginTop = (-Math.floor(size / 2) - (body.className.indexOf('hide-controls') !== -1 ? 0 : h * 0.06)) + 'px';
  }

  function setTime(text) {
    if (timeEl.getAttribute('data-t') === text) { return; }
    timeEl.setAttribute('data-t', text);
    var html = '';
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      html += /[0-9]/.test(ch) ? '<span class="d">' + ch + '</span>' : ch;
    }
    timeEl.innerHTML = html;
    fitText();
  }

  function setPhase(ph) {
    var cur = ' ' + body.className + ' ', keep = '';   // keep the view toggles; only the phase class changes
    if (cur.indexOf(' hide-controls ') !== -1) { keep += ' hide-controls'; }
    if (cur.indexOf(' show-opts ') !== -1) { keep += ' show-opts'; }
    body.className = (ph + keep).replace(/^\s+/, '');
  }

  function render() {
    var ms = remaining(), text, phase = '', nextText = '';
    var t = cfg.tones;
    if (ms > 0) {
      var sec = Math.ceil(ms / 1000);
      text = fmt(sec);
      // Amber once the Warning tone's time is passed, orange once Danger's is.
      for (var j = 0; j < t.length; j++) { if (sec <= t[j].at) { phase = t[j].kind === 'danger' ? 'warn2' : (phase || 'warn1'); } }
      for (var i = 0; i < t.length; i++) { if (sec > t[i].at) { nextText = 'Next tone at ' + fmt(t[i].at); break; } }
      if (!nextText) { nextText = 'Final buzzer at 0:00'; }
    } else {
      var over = Math.floor(-ms / 1000);
      text = cfg.countUp && (running || ms < 0) ? '+' + fmt(over) : '0:00';   // with count-up off it holds at 0:00
      phase = 'over' + ((running && Math.floor(-ms / 500) % 2 === 0) ? ' flash' : '');
      nextText = 'Time is up';
    }
    setTime(text);
    $('next').textContent = nextText;
    setPhase(phase);
  }

  // Plays each cue once, when its time is crossed. Cues more than 5 s overdue (e.g. a background
  // tab the browser had paused) are skipped rather than played late.
  function checkTones() {
    var sec = remaining() / 1000, t = cfg.tones;
    for (var i = 0; i < t.length; i++) {
      if (!fired[i] && sec <= t[i].at) {
        fired[i] = true;
        if (sec > t[i].at - 5) { play(t[i].kind); }
      }
    }
    if (!fired.zero && sec <= 0) { fired.zero = true; if (sec > -5) { play('end'); } }
  }

  function tick() { checkTones(); render(); }

  /* ---------- control ---------- */
  function load(c, idx) {
    stop();
    cfg = { label: c.label, duration: c.duration, tones: c.tones.slice().sort(function (a, b) { return b.at - a.at; }), countUp: c.countUp !== false };
    presetIndex = idx;
    remainingMs = cfg.duration * 1000;
    fired = {};
    $('start').textContent = 'Start';
    $('label').textContent = cfg.label;
    for (var i = 0; i < 3; i++) { $('p' + (i + 1)).className = i === idx ? 'on' : ''; }
    store('last', JSON.stringify({ c: cfg, i: idx }));
    render();
    fitText();
  }

  function start() {
    unlockAudio();
    if (running) { return; }
    // Mark warnings already behind us so resuming doesn't replay them.
    var sec = remainingMs / 1000;
    for (var i = 0; i < cfg.tones.length; i++) { if (sec < cfg.tones[i].at) { fired[i] = true; } }
    if (remainingMs <= 0) { fired.zero = true; }
    endAt = now() + remainingMs;
    running = true;
    tickHandle = setInterval(tick, 100);
    $('start').textContent = 'Pause';
    lockPresets();
    requestWakeLock();
    tick();
  }

  function stop() {
    if (running) { remainingMs = endAt - now(); }
    running = false;
    clearInterval(tickHandle);
    $('start').textContent = remainingMs < cfg_duration_ms() ? 'Resume' : 'Start';
    releaseWakeLock();
    lockPresets();
  }

  // Switching timers mid-countdown would throw away the running time, so it waits for a pause.
  function lockPresets() { for (var i = 1; i <= 3; i++) { $('p' + i).disabled = running; } }
  function pickPreset(i) { if (!running) { load(PRESETS[i], i); } }

  // Tone times set in the operator console. Applied to the presets; the timer on screen is reloaded
  // only when it's untouched (not running, full time), so a countdown is never changed midway.
  function applyToneSettings(timers) {
    for (var i = 0; i < PRESETS.length; i++) {
      var s = timers && timers[PRESETS[i].key], tones = [];
      if (!s) { continue; }
      if (s.warning && s.warning.on && s.warning.at > 0) { tones.push({ at: s.warning.at, kind: 'warning' }); }
      if (s.danger && s.danger.on && s.danger.at > 0) { tones.push({ at: s.danger.at, kind: 'danger' }); }
      PRESETS[i].tones = tones;
      PRESETS[i].countUp = s.count_up !== false;
    }
    if (presetIndex >= 0 && !running && remainingMs === cfg_duration_ms()) { load(PRESETS[presetIndex], presetIndex); }
  }
  function fetchToneSettings() {
    try {
      var x = new XMLHttpRequest();
      x.open('GET', '../api/timer.php?_=' + now(), true);
      x.onreadystatechange = function () {
        if (x.readyState !== 4 || x.status !== 200) { return; }
        try { var r = JSON.parse(x.responseText); if (r && r.timers) { store('tones', JSON.stringify(r.timers)); applyToneSettings(r.timers); } } catch (e) { }
      };
      x.send();
    } catch (e) { }   // opened as a file or offline: keep the cached or built-in times
  }

  function cfg_duration_ms() { return cfg ? cfg.duration * 1000 : 0; }

  function toggle() { if (running) { stop(); render(); } else { start(); } }

  function reset() { load(cfg, presetIndex); }

  function requestWakeLock() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }, function () { });
      }
    } catch (e) { }
  }
  function releaseWakeLock() { try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) { } }

  function toggleFullscreen() {
    var d = document, el = d.documentElement;
    var isFs = d.fullscreenElement || d.webkitFullscreenElement || d.msFullscreenElement;
    if (!isFs) {
      var r = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (r) { r.call(el); }
    } else {
      var x = d.exitFullscreen || d.webkitExitFullscreen || d.msExitFullscreen;
      if (x) { x.call(d); }
    }
  }

  function toggleHide() {
    if (body.className.indexOf('hide-controls') !== -1) { body.className = body.className.replace(/\s*hide-controls/, ''); } else { body.className += ' hide-controls'; }
    fitText();
  }

  function setMuted(m) {
    muted = m;
    $('mute').textContent = 'Sound: ' + (muted ? 'off' : 'on');
    store('muted', muted ? '1' : '0');
    updateAudioNote();
    updateDiag();
  }

  function toggleOpts() {
    var show = body.className.indexOf('show-opts') === -1;
    body.className = show ? body.className + ' show-opts' : body.className.replace(/\s*show-opts/, '');
    $('gear').setAttribute('aria-expanded', show ? 'true' : 'false');
    store('opts', show ? '1' : '0');
    fitText();
  }

  /* ---------- wiring ---------- */
  function on(el, ev, fn) { if (el.addEventListener) { el.addEventListener(ev, fn, false); } else { el.attachEvent('on' + ev, fn); } }

  for (var pi = 0; pi < 3; pi++) {
    (function (i) { on($('p' + (i + 1)), 'click', function () { pickPreset(i); }); })(pi);
  }
  on($('gear'), 'click', function () { toggleOpts(); $('gear').blur(); });
  on($('start'), 'click', toggle);
  on($('reset'), 'click', reset);
  on($('mute'), 'click', function () { setMuted(!muted); });
  // Test plays all three cues in order (about 6 s) so levels can be checked before pitches start.
  // It turns sound on first, so a passing test means the countdown will be heard too.
  on($('test'), 'click', function () { unlockAudio(); if (muted) { setMuted(false); } play('warning', 0); play('danger', 1.3); play('end', 2.3); });
  on($('vol'), 'input', function () { setVolume($('vol').value / 100); });
  on($('vol'), 'change', function () { setVolume($('vol').value / 100); $('vol').blur(); });
  on($('fs'), 'click', toggleFullscreen);
  on($('hide'), 'click', toggleHide);
  on(document, 'click', unlockAudio);
  on(document, 'touchend', unlockAudio);
  on(window, 'resize', fitText);
  on(document, 'visibilitychange', function () { if (!document.hidden && running) { requestWakeLock(); } });

  on(document, 'keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'SELECT') { return; }
    var isRange = tag === 'INPUT' && e.target.type === 'range';
    // The volume slider keeps its arrow keys; every other shortcut still works while it has focus.
    if (isRange && e.keyCode >= 37 && e.keyCode <= 40) { return; }
    unlockAudio();
    var k = e.keyCode;
    if (k === 32) { toggle(); } else if (k === 82) { reset(); } else if (k === 70) { toggleFullscreen(); } else if (k === 77) { setMuted(!muted); } else if (k === 72) { toggleHide(); } else if (k === 68) { var dg = $('diag'); dg.style.display = dg.style.display === 'none' ? 'block' : 'none'; updateDiag(); } else if (k >= 49 && k <= 51) { pickPreset(k - 49); } else { return; }
    if (e.preventDefault) { e.preventDefault(); }
    if (document.activeElement && document.activeElement.blur) { document.activeElement.blur(); }
  });

  /* ---------- init ---------- */
  setMuted(store('muted') === '1');
  (function () {
    var sel = $('endSound'), saved = store('endSound');
    for (var i = 0; i < END_SOUNDS.length; i++) {
      var o = document.createElement('option');
      o.value = END_SOUNDS[i][0]; o.text = END_SOUNDS[i][1];
      sel.appendChild(o);
      if (END_SOUNDS[i][0] === saved) { endSound = saved; }
    }
    sel.value = endSound;
    // Choosing a sound plays it, and unlocks it within this gesture for later.
    on(sel, 'change', function () {
      endSound = sel.value;
      store('endSound', endSound);
      unlockAudio();
      if (!muted) { playCue(endSound); }
      updateDiag();
      sel.blur();
    });
  })();
  var savedVol = parseFloat(store('volume'));
  setVolume(isNaN(savedVol) ? 0.8 : savedVol);
  if (store('opts') === '1') { toggleOpts(); }

  var q = window.location.search, qd = /[?&]d=(\d+)/.exec(q);
  if (qd) {
    var qw = /[?&]w=([\d,]+)/.exec(q), ql = /[?&]label=([^&]+)/.exec(q), wl = [];
    if (qw) { var a = qw[1].split(','); for (var x = 0; x < a.length; x++) { if (+a[x] > 0) { wl.push(+a[x]); } } }
    wl.sort(function (a, b) { return b - a; });
    var tl = [];   // as before: with several times, the last gets the Danger tone, the rest Warning
    for (var y = 0; y < wl.length; y++) { tl.push({ at: wl[y], kind: y === wl.length - 1 && wl.length > 1 ? 'danger' : 'warning' }); }
    load({ label: ql ? decodeURIComponent(ql[1].replace(/\+/g, ' ')) : 'Timer', duration: +qd[1], tones: tl }, -1);
  } else {
    var last = null;
    try { last = JSON.parse(store('last') || 'null'); } catch (e) { }
    // Reopen the last preset (from the current list, so renamed labels show); anything else starts on Final Pitch.
    var li = last && last.i >= 0 && last.i < PRESETS.length ? last.i : 1;
    try { applyToneSettings(JSON.parse(store('tones') || 'null')); } catch (e) { }
    load(PRESETS[li], li);
  }
  fetchToneSettings();
  setInterval(fetchToneSettings, 30000);
})();
</script>
</body>
</html>
