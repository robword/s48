<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>startup48 · Pitch Timer</title>
<!--
  Self-contained pitch timer: no external files, ES5 JavaScript.
  Keys: Space start/pause · R reset · 1/2/3 presets · F fullscreen · M mute · H hide controls
  URL presets: ?d=300&w=60,20&label=Pitch  (seconds)
-->
<style>
  /* Brand fonts come from ../assets/fonts when deployed with the other tools;
     if missing (timer copied on its own) the system fonts below take over. */
  @font-face { font-family: "Poppins"; font-weight: 700; font-display: swap; src: url("../assets/fonts/poppins-700.woff2") format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 800; font-display: swap; src: url("../assets/fonts/poppins-800.woff2") format("woff2"); }
  @font-face { font-family: "Raleway"; font-weight: 100 900; font-display: swap; src: url("../assets/fonts/raleway-variable.woff2") format("woff2"); }
  @font-face { font-family: "Ubuntu"; font-weight: 500; font-display: swap; src: url("../assets/fonts/ubuntu-500.woff2") format("woff2"); }
  html, body { margin: 0; height: 100%; }
  body {
    background: #1b3c52; color: #ffffff;
    font-family: "Ubuntu", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; -webkit-user-select: none; user-select: none;
    -webkit-transition: background-color .4s; transition: background-color .4s;
  }
  /* navy -> amber (first warning) -> brand orange (last warning) -> red (overtime) */
  body.warn1 { background: #b07a0c; }
  body.warn2 { background: #ee512b; }
  body.over { background: #9e1f14; }
  body.over.flash { background: #d0301d; }
  #app { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #label { position: absolute; top: 2vh; left: 0; right: 0; text-align: center; font-family: "Raleway", Arial, sans-serif; font-size: 4vh; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
  #brand { position: absolute; top: 2vh; left: 2vw; font-family: "Poppins", "Arial Black", Arial, sans-serif; font-weight: 800; font-size: 3vh; line-height: 1; text-transform: uppercase; white-space: nowrap; }
  #brand .mark { width: 1.3em; height: 1.3em; vertical-align: -0.32em; margin-right: .3em; }
  #time {
    position: absolute; left: 0; right: 0; top: 50%; text-align: center; line-height: 1;
    font-weight: 700; white-space: nowrap;
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums; -webkit-font-feature-settings: "tnum"; font-feature-settings: "tnum";
  }
  /* Fixed-width slot per digit: Poppins digits are proportional, so the time would shift each second. */
  #time .d { display: inline-block; width: .68em; text-align: center; }
  #next { position: absolute; left: 0; right: 0; bottom: 22vh; text-align: center; font-size: 3.2vh; opacity: .7; }
  #controls {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 1.5vh 2vw 2vh; text-align: center;
    background: rgba(0,0,0,.35);
  }
  body.hide-controls #controls { display: none; }
  body.hide-controls #next { bottom: 3vh; }
  body.hide-controls { cursor: none; }
  button, input { font: inherit; }
  button {
    margin: .4vh .3vw; padding: 1.2vh 1.6vw; font-size: 2.3vh; font-weight: 700;
    color: #ffffff; background: #2f617d; border: 2px solid transparent; border-radius: 8px; cursor: pointer;
  }
  button.on { border-color: #ffffff; }
  button.primary { background: #ee512b; color: #fff; min-width: 12vw; }
  body.warn2 button.primary { background: #ffffff; color: #ee512b; }
  .group { display: inline-block; margin: 0 1vw; vertical-align: middle; }
  #custom { display: none; margin-top: 1vh; font-size: 2.2vh; }
  #custom.open { display: block; }
  #custom input { width: 7em; padding: .5vh .6vw; font-size: 2.2vh; border-radius: 6px; border: 1px solid #3a6c88; background: #1b3c52; color: #ffffff; }
  #custom input.wide { width: 11em; }
  #hint { font-size: 1.6vh; opacity: .55; margin-top: .6vh; }
  #volWrap { display: inline-block; margin: .4vh .6vw; font-size: 2.1vh; font-weight: 700; vertical-align: middle; }
  #vol { width: 9vw; min-width: 90px; vertical-align: middle; accent-color: #ee512b; }
  #audioNote { position: absolute; top: 8vh; left: 0; right: 0; text-align: center; font-size: 2.2vh; color: #ffd27a; display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="brand"><svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"><polygon points="50.00,4.00 89.84,27.00 89.84,73.00 50.00,96.00 10.16,73.00 10.16,27.00"/><line x1="50" y1="50" x2="50.00" y2="4.00"/><line x1="50" y1="50" x2="89.84" y2="27.00"/><line x1="50" y1="50" x2="89.84" y2="73.00"/><line x1="50" y1="50" x2="50.00" y2="96.00"/><line x1="50" y1="50" x2="10.16" y2="73.00"/><line x1="50" y1="50" x2="10.16" y2="27.00"/></g></svg>startup48</div>
  <div id="label">Pitch</div>
  <div id="audioNote">Click anywhere or press a key to enable sound</div>
  <div id="time">5:00</div>
  <div id="next"></div>
  <div id="controls">
    <div class="group">
      <button id="p1" data-preset="0">1 · Practice 1:00</button>
      <button id="p2" data-preset="1">2 · Pitch 5:00</button>
      <button id="p3" data-preset="2">3 · Q&amp;A 5:00</button>
      <button id="pc">Custom…</button>
    </div>
    <div class="group">
      <button id="start" class="primary">Start</button>
      <button id="reset">Reset</button>
    </div>
    <div class="group">
      <button id="mute">Sound: on</button>
      <label id="volWrap">Volume <input id="vol" type="range" min="0" max="100" step="5" value="80" aria-label="Volume"></label>
      <button id="test">Test sounds</button>
      <button id="fs">Fullscreen</button>
      <button id="hide">Hide</button>
    </div>
    <div id="custom">
      Label <input id="cLabel" class="wide" value="Custom">
      Duration <input id="cDur" value="3:00" title="m:ss or seconds">
      Warnings <input id="cWarn" class="wide" value="1:00, 0:30" title="comma separated, m:ss or seconds">
      <button id="cApply">Apply</button>
    </div>
    <div id="hint">Space start/pause · R reset · 1 2 3 presets · F fullscreen · M mute · H hide controls</div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var PRESETS = [
    { label: 'Practice pitch', duration: 60, warnings: [20, 10] },
    { label: 'Pitch', duration: 300, warnings: [60, 20] },
    { label: 'Q&A', duration: 300, warnings: [60, 30] }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var body = document.body;
  var timeEl = $('time');

  var cfg = null;          // active {label, duration, warnings(desc)}
  var presetIndex = -1;    // -1 = custom
  var running = false;
  var endAt = 0;           // ms timestamp when remaining hits 0
  var remainingMs = 0;     // used while paused
  var fired = {};          // warning seconds already sounded; 'zero' for the final buzzer
  var muted = false;
  var tickHandle = null;
  var wakeLock = null;

  /* ---------- storage (optional) ---------- */
  function store(key, val) {
    try { if (val === undefined) { return window.localStorage.getItem('s48timer.' + key); } window.localStorage.setItem('s48timer.' + key, val); } catch (e) { }
    return null;
  }

  /* ---------- audio ---------- */
  // Cues ported from pitch-timer-tones.js: a Web Audio re-creation of pitchtimer.com's
  // warning / danger / end sounds, measured from the originals (no audio files).
  // Kept in ES5 and without chained connect() calls so older browsers still work.
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null;
  var master = null;
  var volume = 0.8;
  var fallbackUri = null;

  function ensureAudio() {
    if (AC && !ctx) {
      try {
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = volume;
        master.connect(ctx.destination);
      } catch (e) { ctx = null; master = null; }
    }
    if (ctx && ctx.state === 'suspended' && ctx.resume) { ctx.resume(); }
    updateAudioNote();
  }

  function updateAudioNote() {
    $('audioNote').style.display = (ctx && ctx.state === 'suspended') ? 'block' : 'none';
  }

  var imul = Math.imul || function (a, b) {
    var ah = (a >>> 16) & 0xffff, al = a & 0xffff, bh = (b >>> 16) & 0xffff, bl = b & 0xffff;
    return ((al * bl) + (((ah * bl + al * bh) << 16) >>> 0)) | 0;
  };

  // Small seeded PRNG so the end cue sounds identical every time.
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function chain(nodes) {
    for (var i = 0; i < nodes.length - 1; i++) { nodes[i].connect(nodes[i + 1]); }
  }

  // Level trim for the noise cue so its loudness matches the original.
  var END_GAIN = 0.75;

  // Each tone schedules itself at time t into node out and returns its length in seconds.
  var TONES = {
    // One clean sine at C5. Instant attack, smooth exponential decay (~0.25 s), ~0.8 s audible.
    warning: function (t, out) {
      var osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.7, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.04, t + 0.78);
      g.gain.linearRampToValueAtTime(0, t + 0.85);
      chain([osc, g, out]);
      osc.start(t);
      osc.stop(t + 0.9);
      return 0.9;
    },

    // Short, bright, bell-like ping: three inharmonic sine partials.
    danger: function (t, out) {
      var partials = [[1575, 0.39], [3075, 0.44], [4925, 0.08]];
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(1, t + 0.05);
      g.gain.linearRampToValueAtTime(0.8, t + 0.20);
      g.gain.exponentialRampToValueAtTime(0.17, t + 0.31);
      g.gain.exponentialRampToValueAtTime(0.07, t + 0.46);
      g.gain.linearRampToValueAtTime(0, t + 0.55);
      g.connect(out);
      for (var i = 0; i < partials.length; i++) {
        var osc = ctx.createOscillator(), pg = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(partials[i][0], t);
        pg.gain.value = partials[i][1];
        chain([osc, pg, g]);
        osc.start(t);
        osc.stop(t + 0.6);
      }
      return 0.6;
    },

    // Not a pitched tone: ~3.6 s of band-passed (800-2400 Hz), flickering noise that
    // fades in over ~0.6 s, holds, then fades out from ~3.1 s.
    end: function (t, out) {
      var dur = 3.8;
      var rand = mulberry32(8744);
      var len = Math.floor(ctx.sampleRate * dur);
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) { data[i] = rand() * 2 - 1; }

      var src = ctx.createBufferSource();
      src.buffer = buf;

      var hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 800; hp.Q.value = 0.7;
      var lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 2400; lp.Q.value = 0.7;

      // Overall fade in / hold / fade out.
      var env = ctx.createGain();
      env.gain.setValueAtTime(0.0001, t);
      env.gain.setValueAtTime(0.0001, t + 0.15);
      env.gain.linearRampToValueAtTime(0.9, t + 0.75);
      env.gain.setValueAtTime(0.9, t + 3.1);
      env.gain.linearRampToValueAtTime(0, t + 3.65);

      // Random flutter on top (about 25 Hz, +/-30%).
      var flutter = ctx.createGain();
      var steps = Math.floor(dur * 25);
      var curve = new Float32Array(steps);
      for (var j = 0; j < steps; j++) { curve[j] = 0.7 + rand() * 0.6; }
      flutter.gain.setValueCurveAtTime(curve, t, dur);

      var trim = ctx.createGain();
      trim.gain.value = END_GAIN;

      chain([src, hp, lp, flutter, env, trim, out]);
      src.start(t);
      return dur;
    }
  };

  // Without Web Audio: 1, 2 or 3 short beeps so the cues are still distinguishable.
  var FALLBACK_BEEPS = { warning: 1, danger: 2, end: 3 };

  // Play a cue now, or `delay` seconds from now. force ignores the mute setting (test button).
  function play(name, delay, force) {
    if (muted && !force) { return; }
    delay = delay || 0;
    if (ctx && master) {
      try { TONES[name](ctx.currentTime + 0.02 + delay, master); } catch (e) { }
      return;
    }
    try {
      if (!fallbackUri) { fallbackUri = makeWav(880, 0.25); }
      var n = FALLBACK_BEEPS[name] || 1, k = 0;
      var next = function () {
        var a = new Audio(fallbackUri);
        a.volume = volume;
        a.play();
        if (++k < n) { setTimeout(next, 350); }
      };
      setTimeout(next, delay * 1000);
    } catch (e) { }
  }

  function setVolume(v) {
    volume = Math.max(0, Math.min(1, v));
    if (master) { master.gain.value = volume; }
    $('vol').value = Math.round(volume * 100);
    store('volume', String(volume));
  }

  function makeWav(freq, secs) {
    var rate = 8000, n = Math.floor(rate * secs), bytes = [], i;
    function u32(v) { bytes.push(v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >> 24) & 255); }
    function u16(v) { bytes.push(v & 255, (v >> 8) & 255); }
    function str(s) { for (var j = 0; j < s.length; j++) { bytes.push(s.charCodeAt(j)); } }
    str('RIFF'); u32(36 + n); str('WAVE'); str('fmt '); u32(16); u16(1); u16(1); u32(rate); u32(rate); u16(1); u16(8);
    str('data'); u32(n);
    for (i = 0; i < n; i++) { bytes.push(Math.sin(2 * Math.PI * freq * i / rate) > 0 ? 220 : 36); }
    var bin = '';
    for (i = 0; i < bytes.length; i++) { bin += String.fromCharCode(bytes[i]); }
    return 'data:audio/wav;base64,' + window.btoa(bin);
  }

  /* ---------- time helpers ---------- */
  function parseTime(s) {
    s = String(s).replace(/\s+/g, '');
    if (!s) { return NaN; }
    if (s.indexOf(':') !== -1) {
      var p = s.split(':');
      return parseInt(p[0] || '0', 10) * 60 + parseInt(p[1] || '0', 10);
    }
    return parseInt(s, 10);
  }

  function fmt(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function now() { return new Date().getTime(); }

  function remaining() { return running ? endAt - now() : remainingMs; }

  /* ---------- display ---------- */
  function fitText() {
    var w = window.innerWidth, h = window.innerHeight;
    var chars = Math.max(4, timeEl.textContent.length);
    // tabular digits ~0.6em wide; leave room for label and controls
    var size = Math.min(w * 0.94 / (chars * 0.62), h * (body.className.indexOf('hide-controls') !== -1 ? 0.66 : 0.55));
    timeEl.style.fontSize = Math.floor(size) + 'px';
    timeEl.style.marginTop = (-Math.floor(size / 2) - (body.className.indexOf('hide-controls') !== -1 ? 0 : h * 0.06)) + 'px';
  }

  function setTime(text) {
    if (timeEl.getAttribute('data-t') === text) { return; }
    timeEl.setAttribute('data-t', text);
    var html = '';
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      html += /[0-9]/.test(ch) ? '<span class="d">' + ch + '</span>' : ch;
    }
    timeEl.innerHTML = html;
    fitText();
  }

  function setPhase(ph) {
    var keep = (' ' + body.className + ' ').indexOf(' hide-controls ') !== -1 ? ' hide-controls' : '';
    body.className = (ph + keep).replace(/^\s+/, '');
  }

  function render() {
    var ms = remaining(), text, phase = '', nextText = '';
    var w = cfg.warnings;
    if (ms > 0) {
      var sec = Math.ceil(ms / 1000);
      text = fmt(sec);
      if (w.length && sec <= w[w.length - 1]) { phase = 'warn2'; } else if (w.length && sec <= w[0]) { phase = 'warn1'; }
      for (var i = 0; i < w.length; i++) { if (sec > w[i]) { nextText = 'Next tone at ' + fmt(w[i]); break; } }
      if (!nextText) { nextText = 'Final buzzer at 0:00'; }
    } else {
      var over = Math.floor(-ms / 1000);
      text = (running || ms < 0) ? '+' + fmt(over) : '0:00';
      phase = 'over' + ((running && Math.floor(-ms / 500) % 2 === 0) ? ' flash' : '');
      nextText = 'Time is up';
    }
    setTime(text);
    $('next').textContent = nextText;
    setPhase(phase);
  }

  function checkTones() {
    var sec = remaining() / 1000, w = cfg.warnings;
    for (var i = 0; i < w.length; i++) {
      if (!fired[w[i]] && sec <= w[i]) {
        fired[w[i]] = true;
        // Only sound if we crossed it recently (not when jumping in mid-way).
        // Last warning gets the danger cue, earlier ones the warning cue.
        if (sec > w[i] - 2) { play(i === w.length - 1 && w.length > 1 ? 'danger' : 'warning'); }
      }
    }
    if (!fired.zero && sec <= 0) { fired.zero = true; if (sec > -2) { play('end'); } }
  }

  function tick() { checkTones(); render(); }

  /* ---------- control ---------- */
  function load(c, idx) {
    stop();
    cfg = { label: c.label, duration: c.duration, warnings: c.warnings.slice().sort(function (a, b) { return b - a; }) };
    presetIndex = idx;
    remainingMs = cfg.duration * 1000;
    fired = {};
    $('start').textContent = 'Start';
    $('label').textContent = cfg.label;
    for (var i = 0; i < 3; i++) { $('p' + (i + 1)).className = i === idx ? 'on' : ''; }
    $('pc').className = idx === -1 ? 'on' : '';
    store('last', JSON.stringify({ c: cfg, i: idx }));
    render();
    fitText();
  }

  function start() {
    ensureAudio();
    if (running) { return; }
    // Mark warnings already behind us so resuming doesn't replay them.
    var sec = remainingMs / 1000;
    for (var i = 0; i < cfg.warnings.length; i++) { if (sec < cfg.warnings[i]) { fired[cfg.warnings[i]] = true; } }
    endAt = now() + remainingMs;
    running = true;
    tickHandle = setInterval(tick, 100);
    $('start').textContent = 'Pause';
    requestWakeLock();
    tick();
  }

  function stop() {
    if (running) { remainingMs = endAt - now(); }
    running = false;
    clearInterval(tickHandle);
    $('start').textContent = remainingMs < cfg_duration_ms() ? 'Resume' : 'Start';
    releaseWakeLock();
  }

  function cfg_duration_ms() { return cfg ? cfg.duration * 1000 : 0; }

  function toggle() { if (running) { stop(); render(); } else { start(); } }

  function reset() { load(cfg, presetIndex); }

  function requestWakeLock() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }, function () { });
      }
    } catch (e) { }
  }
  function releaseWakeLock() { try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) { } }

  function toggleFullscreen() {
    var d = document, el = d.documentElement;
    var isFs = d.fullscreenElement || d.webkitFullscreenElement || d.msFullscreenElement;
    if (!isFs) {
      var r = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (r) { r.call(el); }
    } else {
      var x = d.exitFullscreen || d.webkitExitFullscreen || d.msExitFullscreen;
      if (x) { x.call(d); }
    }
  }

  function toggleHide() {
    if (body.className.indexOf('hide-controls') !== -1) { body.className = body.className.replace(/\s*hide-controls/, ''); } else { body.className += ' hide-controls'; }
    fitText();
  }

  function setMuted(m) {
    muted = m;
    $('mute').textContent = 'Sound: ' + (muted ? 'off' : 'on');
    store('muted', muted ? '1' : '0');
  }

  function applyCustom() {
    var d = parseTime($('cDur').value);
    if (!(d > 0)) { alert('Enter a duration like 3:00 or 180'); return; }
    var parts = $('cWarn').value.split(','), w = [], i;
    for (i = 0; i < parts.length; i++) {
      var t = parseTime(parts[i]);
      if (t > 0 && t < d) { w.push(t); }
    }
    var c = { label: $('cLabel').value || 'Custom', duration: d, warnings: w };
    store('custom', JSON.stringify(c));
    load(c, -1);
  }

  /* ---------- wiring ---------- */
  function on(el, ev, fn) { if (el.addEventListener) { el.addEventListener(ev, fn, false); } else { el.attachEvent('on' + ev, fn); } }

  for (var pi = 0; pi < 3; pi++) {
    (function (i) { on($('p' + (i + 1)), 'click', function () { load(PRESETS[i], i); }); })(pi);
  }
  on($('pc'), 'click', function () { var c = $('custom'); c.className = c.className === 'open' ? '' : 'open'; });
  on($('cApply'), 'click', applyCustom);
  on($('start'), 'click', toggle);
  on($('reset'), 'click', reset);
  on($('mute'), 'click', function () { setMuted(!muted); });
  // Test plays all three cues in order (about 6 s) so levels can be checked before pitches start.
  on($('test'), 'click', function () { ensureAudio(); play('warning', 0, true); play('danger', 1.3, true); play('end', 2.3, true); });
  on($('vol'), 'input', function () { setVolume($('vol').value / 100); });
  on($('vol'), 'change', function () { setVolume($('vol').value / 100); $('vol').blur(); });
  on($('fs'), 'click', toggleFullscreen);
  on($('hide'), 'click', toggleHide);
  on(document, 'click', ensureAudio);
  on(window, 'resize', fitText);
  on(document, 'visibilitychange', function () { if (!document.hidden && running) { requestWakeLock(); } });

  on(document, 'keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    var isRange = tag === 'INPUT' && e.target.type === 'range';
    if (tag === 'INPUT' && !isRange) { if (e.keyCode === 13) { applyCustom(); } return; }
    // The volume slider keeps its arrow keys; every other shortcut still works while it has focus.
    if (isRange && e.keyCode >= 37 && e.keyCode <= 40) { return; }
    ensureAudio();
    var k = e.keyCode;
    if (k === 32) { toggle(); } else if (k === 82) { reset(); } else if (k === 70) { toggleFullscreen(); } else if (k === 77) { setMuted(!muted); } else if (k === 72) { toggleHide(); } else if (k >= 49 && k <= 51) { load(PRESETS[k - 49], k - 49); } else { return; }
    if (e.preventDefault) { e.preventDefault(); }
    if (document.activeElement && document.activeElement.blur) { document.activeElement.blur(); }
  });

  /* ---------- init ---------- */
  setMuted(store('muted') === '1');
  var savedVol = parseFloat(store('volume'));
  setVolume(isNaN(savedVol) ? 0.8 : savedVol);
  try {
    var cust = JSON.parse(store('custom') || 'null');
    if (cust) { $('cLabel').value = cust.label; $('cDur').value = fmt(cust.duration); var ws = []; for (var j = 0; j < cust.warnings.length; j++) { ws.push(fmt(cust.warnings[j])); } $('cWarn').value = ws.join(', '); }
  } catch (e) { }

  var q = window.location.search, qd = /[?&]d=(\d+)/.exec(q);
  if (qd) {
    var qw = /[?&]w=([\d,]+)/.exec(q), ql = /[?&]label=([^&]+)/.exec(q), wl = [];
    if (qw) { var a = qw[1].split(','); for (var x = 0; x < a.length; x++) { if (+a[x] > 0) { wl.push(+a[x]); } } }
    load({ label: ql ? decodeURIComponent(ql[1].replace(/\+/g, ' ')) : 'Timer', duration: +qd[1], warnings: wl }, -1);
  } else {
    var last = null;
    try { last = JSON.parse(store('last') || 'null'); } catch (e) { }
    if (last && last.c && last.c.duration > 0) { load(last.c, last.i); } else { load(PRESETS[1], 1); }
  }
})();
</script>
