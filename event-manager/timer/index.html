<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>startup48 · Pitch Timer</title>
<!--
  Self-contained pitch timer: no external files, ES5 JavaScript.
  Keys: Space start/pause · R reset · 1/2/3 presets · F fullscreen · M mute · H hide controls
  URL presets: ?d=300&w=60,20&label=Pitch  (seconds)
-->
<style>
  /* Brand fonts come from ../assets/fonts when deployed with the other tools;
     if missing (timer copied on its own) the system fonts below take over. */
  @font-face { font-family: "Poppins"; font-weight: 700; font-display: swap; src: url("../assets/fonts/poppins-700.woff2") format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 800; font-display: swap; src: url("../assets/fonts/poppins-800.woff2") format("woff2"); }
  @font-face { font-family: "Raleway"; font-weight: 100 900; font-display: swap; src: url("../assets/fonts/raleway-variable.woff2") format("woff2"); }
  @font-face { font-family: "Ubuntu"; font-weight: 500; font-display: swap; src: url("../assets/fonts/ubuntu-500.woff2") format("woff2"); }
  html, body { margin: 0; height: 100%; }
  body {
    background: #1b3c52; color: #ffffff;
    font-family: "Ubuntu", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; -webkit-user-select: none; user-select: none;
    -webkit-transition: background-color .4s; transition: background-color .4s;
  }
  /* navy -> amber (first warning) -> brand orange (last warning) -> red (overtime) */
  body.warn1 { background: #b07a0c; }
  body.warn2 { background: #ee512b; }
  body.over { background: #9e1f14; }
  body.over.flash { background: #d0301d; }
  #app { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #label { position: absolute; top: 2vh; left: 0; right: 0; text-align: center; font-family: "Raleway", Arial, sans-serif; font-size: 4vh; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
  #brand { position: absolute; top: 2vh; left: 2vw; font-family: "Poppins", "Arial Black", Arial, sans-serif; font-weight: 800; font-size: 3vh; line-height: 1; text-transform: uppercase; white-space: nowrap; }
  #brand .mark { width: 1.3em; height: 1.3em; vertical-align: -0.32em; margin-right: .3em; }
  #time {
    position: absolute; left: 0; right: 0; top: 50%; text-align: center; line-height: 1;
    font-weight: 700; white-space: nowrap;
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums; -webkit-font-feature-settings: "tnum"; font-feature-settings: "tnum";
  }
  /* Fixed-width slot per digit: Poppins digits are proportional, so the time would shift each second. */
  #time .d { display: inline-block; width: .68em; text-align: center; }
  #next { position: absolute; left: 0; right: 0; bottom: 22vh; text-align: center; font-size: 3.2vh; opacity: .7; }
  #controls {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 1.5vh 2vw 2vh; text-align: center;
    background: rgba(0,0,0,.35);
  }
  body.hide-controls #controls { display: none; }
  body.hide-controls #next { bottom: 3vh; }
  body.hide-controls { cursor: none; }
  button, input { font: inherit; }
  button {
    margin: .4vh .3vw; padding: 1.2vh 1.6vw; font-size: 2.3vh; font-weight: 700;
    color: #ffffff; background: #2f617d; border: 2px solid transparent; border-radius: 8px; cursor: pointer;
  }
  button.on { border-color: #ffffff; }
  button.primary { background: #ee512b; color: #fff; min-width: 12vw; }
  body.warn2 button.primary { background: #ffffff; color: #ee512b; }
  .group { display: inline-block; margin: 0 1vw; vertical-align: middle; }
  #custom { display: none; margin-top: 1vh; font-size: 2.2vh; }
  #custom.open { display: block; }
  #custom input { width: 7em; padding: .5vh .6vw; font-size: 2.2vh; border-radius: 6px; border: 1px solid #3a6c88; background: #1b3c52; color: #ffffff; }
  #custom input.wide { width: 11em; }
  #hint { font-size: 1.6vh; opacity: .55; margin-top: .6vh; }
  #volWrap { display: inline-block; margin: .4vh .6vw; font-size: 2.1vh; font-weight: 700; vertical-align: middle; }
  #vol { width: 9vw; min-width: 90px; vertical-align: middle; accent-color: #ee512b; }
  #diag { position: absolute; left: 1vw; right: 1vw; bottom: 1vh; z-index: 5; padding: .6vh 1vw; font: 1.6vh/1.4 Menlo, Consolas, monospace; background: rgba(0,0,0,.75); color: #fff; border-radius: 6px; }
  #audioNote { position: absolute; top: 8vh; left: 0; right: 0; text-align: center; font-size: 2.2vh; color: #ffd27a; display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="brand"><svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"><polygon points="50.00,4.00 89.84,27.00 89.84,73.00 50.00,96.00 10.16,73.00 10.16,27.00"/><line x1="50" y1="50" x2="50.00" y2="4.00"/><line x1="50" y1="50" x2="89.84" y2="27.00"/><line x1="50" y1="50" x2="89.84" y2="73.00"/><line x1="50" y1="50" x2="50.00" y2="96.00"/><line x1="50" y1="50" x2="10.16" y2="73.00"/><line x1="50" y1="50" x2="10.16" y2="27.00"/></g></svg>startup48</div>
  <div id="label">Pitch</div>
  <div id="diag" style="display:none"></div>
  <div id="audioNote">Click anywhere or press a key to enable sound</div>
  <div id="time">5:00</div>
  <div id="next"></div>
  <div id="controls">
    <div class="group">
      <button id="p1" data-preset="0">1 · Practice 1:00</button>
      <button id="p2" data-preset="1">2 · Pitch 5:00</button>
      <button id="p3" data-preset="2">3 · Q&amp;A 5:00</button>
      <button id="pc">Custom…</button>
    </div>
    <div class="group">
      <button id="start" class="primary">Start</button>
      <button id="reset">Reset</button>
    </div>
    <div class="group">
      <button id="mute">Sound: on</button>
      <label id="volWrap">Volume <input id="vol" type="range" min="0" max="100" step="5" value="80" aria-label="Volume"></label>
      <button id="test">Test sounds</button>
      <button id="fs">Fullscreen</button>
      <button id="hide">Hide</button>
    </div>
    <div id="custom">
      Label <input id="cLabel" class="wide" value="Custom">
      Duration <input id="cDur" value="3:00" title="m:ss or seconds">
      Warnings <input id="cWarn" class="wide" value="1:00, 0:30" title="comma separated, m:ss or seconds">
      <button id="cApply">Apply</button>
    </div>
    <div id="hint">Space start/pause · R reset · 1 2 3 presets · F fullscreen · M mute · H hide controls · D audio diagnostics</div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var PRESETS = [
    { label: 'Practice pitch', duration: 60, warnings: [20, 10] },
    { label: 'Pitch', duration: 300, warnings: [60, 20] },
    { label: 'Q&A', duration: 300, warnings: [60, 30] }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var body = document.body;
  var timeEl = $('time');

  var cfg = null;          // active {label, duration, warnings(desc)}
  var presetIndex = -1;    // -1 = custom
  var running = false;
  var endAt = 0;           // ms timestamp when remaining hits 0
  var remainingMs = 0;     // used while paused
  var fired = {};          // warning seconds already sounded; 'zero' for the final buzzer
  var muted = false;
  var tickHandle = null;
  var wakeLock = null;

  /* ---------- storage (optional) ---------- */
  function store(key, val) {
    try { if (val === undefined) { return window.localStorage.getItem('s48timer.' + key); } window.localStorage.setItem('s48timer.' + key, val); } catch (e) { }
    return null;
  }

  /* ---------- audio ---------- */
  // Cues re-created from pitch-timer-tones.js (pitchtimer.com's warning / danger / end sounds).
  // For the widest browser support they are rendered once to WAV in plain JavaScript and played
  // through <audio> elements at the moment each cue is reached, as pitchtimer.com does. <audio> also
  // plays when an iPhone/iPad is on silent. Web Audio is used only if an <audio> element refuses.
  var CUE_RATE = 22050;     // ample for these sounds (highest partial 4.9 kHz)
  var END_GAIN = 0.75;      // level trim so the noise cue matches the original's loudness
  var CUE_NAMES = ['warning', 'danger', 'end'];
  var volume = 0.8;
  var cues = null;          // name -> { pcm: Float32Array, url: string, el: HTMLAudioElement|null }
  var unlocked = false;
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null;
  var diag = { path: '-', last: '-', error: '' };

  var imul = Math.imul || function (a, b) {
    var ah = (a >>> 16) & 0xffff, al = a & 0xffff, bh = (b >>> 16) & 0xffff, bl = b & 0xffff;
    return ((al * bl) + (((ah * bl + al * bh) << 16) >>> 0)) | 0;
  };

  // Small seeded PRNG so the end cue sounds identical every time.
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Gain envelope with Web Audio's automation semantics. ev: [[type, value, time], ...],
  // type 'set' (jump), 'lin' or 'exp' (ramp from the previous point).
  function envelope(ev, n, rate) {
    var out = new Float32Array(n), k = 0, v = ev[0][1], t;
    for (var i = 0; i < n; i++) {
      t = i / rate;
      while (k + 1 < ev.length && t >= ev[k + 1][2]) { k++; v = ev[k][1]; }
      var nx = ev[k + 1];
      if (nx && nx[0] !== 'set' && t >= ev[k][2]) {
        var f = (t - ev[k][2]) / (nx[2] - ev[k][2]);
        v = nx[0] === 'lin' ? ev[k][1] + (nx[1] - ev[k][1]) * f : ev[k][1] * Math.pow(nx[1] / ev[k][1], f);
      } else if (!nx || nx[0] === 'set') {
        v = ev[k][1];
      }
      out[i] = v;
    }
    return out;
  }

  // Biquad filter (Audio EQ Cookbook, as Web Audio uses; Q given in dB like Web Audio's lowpass/highpass).
  function biquad(x, type, freq, qDb, rate) {
    var w0 = 2 * Math.PI * freq / rate, cs = Math.cos(w0), alpha = Math.sin(w0) / (2 * Math.pow(10, qDb / 20));
    var b0 = type === 'lowpass' ? (1 - cs) / 2 : (1 + cs) / 2, b1 = type === 'lowpass' ? 1 - cs : -(1 + cs), b2 = b0;
    var a0 = 1 + alpha, a1 = -2 * cs, a2 = 1 - alpha;
    var y = new Float32Array(x.length), x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for (var i = 0; i < x.length; i++) {
      var o = (b0 * x[i] + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2) / a0;
      x2 = x1; x1 = x[i]; y2 = y1; y1 = o; y[i] = o;
    }
    return y;
  }

  // Render one cue to samples at CUE_RATE (numbers from pitch-timer-tones.js).
  function synth(name) {
    var r = CUE_RATE, n, i, out, env;
    if (name === 'warning') {
      // One clean sine at C5; instant attack, smooth exponential decay, ~0.8 s audible.
      n = Math.floor(0.9 * r); out = new Float32Array(n);
      env = envelope([['set', 0.0001, 0], ['lin', 0.7, 0.005], ['exp', 0.04, 0.78], ['lin', 0, 0.85]], n, r);
      for (i = 0; i < n; i++) { out[i] = Math.sin(2 * Math.PI * 523.25 * i / r) * env[i]; }
      return out;
    }
    if (name === 'danger') {
      // Short bright ping: three inharmonic partials.
      n = Math.floor(0.6 * r); out = new Float32Array(n);
      env = envelope([['set', 0.0001, 0], ['lin', 1, 0.05], ['lin', 0.8, 0.2], ['exp', 0.17, 0.31], ['exp', 0.07, 0.46], ['lin', 0, 0.55]], n, r);
      for (i = 0; i < n; i++) {
        var t = i / r;
        out[i] = env[i] * (0.39 * Math.sin(2 * Math.PI * 1575 * t) + 0.44 * Math.sin(2 * Math.PI * 3075 * t) + 0.08 * Math.sin(2 * Math.PI * 4925 * t));
      }
      return out;
    }
    // end: band-passed (800-2400 Hz) noise with ~25 Hz flutter; fades in after 150 ms, out by ~3.65 s.
    var dur = 3.8, rand = mulberry32(8744);
    n = Math.floor(dur * r);
    // White noise spreads its power over 0..rate/2, so scale to the band energy the original had
    // when rendered at a typical 48 kHz device rate.
    var noise = new Float32Array(n), level = Math.sqrt(r / 48000);
    for (i = 0; i < n; i++) { noise[i] = (rand() * 2 - 1) * level; }
    var band = biquad(biquad(noise, 'highpass', 800, 0.7, r), 'lowpass', 2400, 0.7, r);
    var steps = Math.floor(dur * 25), curve = [];
    for (i = 0; i < steps; i++) { curve.push(0.7 + rand() * 0.6); }
    env = envelope([['set', 0.0001, 0], ['set', 0.0001, 0.15], ['lin', 0.9, 0.75], ['set', 0.9, 3.1], ['lin', 0, 3.65]], n, r);
    out = new Float32Array(n);
    for (i = 0; i < n; i++) {
      var p = (i / n) * (steps - 1), j = Math.floor(p), fl = curve[j] + (curve[Math.min(j + 1, steps - 1)] - curve[j]) * (p - j);
      out[i] = band[i] * fl * env[i] * END_GAIN;
    }
    return out;
  }

  // 16-bit mono WAV. Blob URL where supported, data: URI otherwise.
  function wavUrl(pcm, rate) {
    var n = pcm.length, buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf), i;
    function str(o, s) { for (var j = 0; j < s.length; j++) { dv.setUint8(o + j, s.charCodeAt(j)); } }
    str(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    str(36, 'data'); dv.setUint32(40, n * 2, true);
    for (i = 0; i < n; i++) { var s = Math.max(-1, Math.min(1, pcm[i])); dv.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
    try {
      if (window.Blob && window.URL && URL.createObjectURL) { return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); }
    } catch (e) { }
    var bytes = new Uint8Array(buf), bin = '';
    for (i = 0; i < bytes.length; i++) { bin += String.fromCharCode(bytes[i]); }
    return 'data:audio/wav;base64,' + window.btoa(bin);
  }

  function buildCues() {
    if (cues) { return; }
    cues = {};
    for (var i = 0; i < CUE_NAMES.length; i++) {
      var name = CUE_NAMES[i], pcm = synth(name), el = null, url = wavUrl(pcm, CUE_RATE);
      try { el = new Audio(); el.preload = 'auto'; el.src = url; if (el.load) { el.load(); } } catch (e) { el = null; }
      cues[name] = { pcm: pcm, url: url, el: el };
    }
  }

  // Must run inside a click/tap/keypress: browsers (iOS especially) only allow sound to start
  // from a user gesture, so each <audio> element is played silently once to unlock it.
  function unlockAudio() {
    buildCues();
    if (!unlocked) {
      unlocked = true;
      for (var i = 0; i < CUE_NAMES.length; i++) {
        var el = cues[CUE_NAMES[i]].el;
        if (!el) { continue; }
        try {
          el.muted = true;
          var p = el.play();
          (function (el) {
            // Skip if a real cue has already claimed this element (playCue unmutes it first).
            var done = function () { if (el.muted) { try { el.pause(); el.currentTime = 0; } catch (e) { } el.muted = false; } };
            if (p && p.then) { p.then(done, function () { el.muted = false; }); } else { done(); }
          })(el);
        } catch (e) { el.muted = false; }
      }
    }
    // Prepare the Web Audio fallback in the same gesture.
    if (AC && !ctx) {
      try {
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = volume;
        master.connect(ctx.destination);
        // iOS 17+: let Web Audio play even when the ringer switch is on silent.
        if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch (e) { } }
      } catch (e) { ctx = null; master = null; }
    }
    if (ctx && ctx.state === 'suspended' && ctx.resume) { try { ctx.resume(); } catch (e) { } }
    updateAudioNote();
  }

  function playWebAudio(name) {
    if (!ctx || !master) { return false; }
    try {
      var c = cues[name], buf = ctx.createBuffer(1, c.pcm.length, CUE_RATE);
      if (buf.copyToChannel) { buf.copyToChannel(c.pcm, 0); } else { buf.getChannelData(0).set(c.pcm); }
      var src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(master);
      if (src.start) { src.start(0); } else { src.noteOn(0); }
      diag.path = 'Web Audio (' + ctx.state + ')';
      return true;
    } catch (e) {
      diag.error = 'Web Audio: ' + (e && e.name ? e.name : e);
      return false;
    }
  }

  function playCue(name) {
    buildCues();
    var c = cues[name], el = c.el;
    diag.last = name + ' at ' + new Date().toLocaleTimeString();
    if (!el) { playWebAudio(name); updateDiag(); return; }
    try {
      el.pause();
      el.currentTime = 0;
      el.muted = false;
      el.volume = volume;
      var p = el.play();
      diag.path = '<audio> element';
      if (p && p.then) {
        p.then(updateDiag, function (err) {
          // Refused (e.g. NotAllowedError when audio wasn't unlocked by a gesture): try Web Audio.
          diag.error = '<audio>: ' + (err && err.name ? err.name : err);
          playWebAudio(name);
          updateDiag();
        });
      }
    } catch (e) {
      diag.error = '<audio>: ' + (e && e.name ? e.name : e);
      playWebAudio(name);
    }
    updateDiag();
  }

  // Play a cue now, or `delay` seconds from now.
  function play(name, delay) {
    if (muted) { return; }
    if (delay) { setTimeout(function () { if (!muted) { playCue(name); } }, delay * 1000); } else { playCue(name); }
  }

  function setVolume(v) {
    volume = Math.max(0, Math.min(1, v));
    if (master) { master.gain.value = volume; }
    if (cues) { for (var k in cues) { if (cues.hasOwnProperty(k) && cues[k].el) { cues[k].el.volume = volume; } } }
    $('vol').value = Math.round(volume * 100);
    store('volume', String(volume));
  }

  function updateAudioNote() {
    var note = $('audioNote');
    if (muted) {
      note.textContent = 'Sound is off — press M or the Sound button to turn it on';
      note.style.display = 'block';
    } else if (!unlocked) {
      note.textContent = 'Click anywhere or press a key to enable sound';
      note.style.display = 'block';
    } else {
      note.style.display = 'none';
    }
  }

  // Press D for an audio diagnostics line (which playback path is used, and any error).
  function updateDiag() {
    var d = $('diag');
    if (d.style.display === 'none') { return; }
    d.textContent = 'Audio: ' + diag.path + ' | unlocked: ' + (unlocked ? 'yes' : 'no') +
      ' | Web Audio: ' + (ctx ? ctx.state : (AC ? 'not started' : 'unsupported')) +
      ' | sound: ' + (muted ? 'off' : 'on') + ', volume ' + Math.round(volume * 100) + '%' +
      ' | last cue: ' + diag.last + (diag.error ? ' | last error: ' + diag.error : '');
  }

  /* ---------- time helpers ---------- */
  function parseTime(s) {
    s = String(s).replace(/\s+/g, '');
    if (!s) { return NaN; }
    if (s.indexOf(':') !== -1) {
      var p = s.split(':');
      return parseInt(p[0] || '0', 10) * 60 + parseInt(p[1] || '0', 10);
    }
    return parseInt(s, 10);
  }

  function fmt(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function now() { return new Date().getTime(); }

  function remaining() { return running ? endAt - now() : remainingMs; }

  /* ---------- display ---------- */
  function fitText() {
    var w = window.innerWidth, h = window.innerHeight;
    var chars = Math.max(4, timeEl.textContent.length);
    // tabular digits ~0.6em wide; leave room for label and controls
    var size = Math.min(w * 0.94 / (chars * 0.62), h * (body.className.indexOf('hide-controls') !== -1 ? 0.66 : 0.55));
    timeEl.style.fontSize = Math.floor(size) + 'px';
    timeEl.style.marginTop = (-Math.floor(size / 2) - (body.className.indexOf('hide-controls') !== -1 ? 0 : h * 0.06)) + 'px';
  }

  function setTime(text) {
    if (timeEl.getAttribute('data-t') === text) { return; }
    timeEl.setAttribute('data-t', text);
    var html = '';
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      html += /[0-9]/.test(ch) ? '<span class="d">' + ch + '</span>' : ch;
    }
    timeEl.innerHTML = html;
    fitText();
  }

  function setPhase(ph) {
    var keep = (' ' + body.className + ' ').indexOf(' hide-controls ') !== -1 ? ' hide-controls' : '';
    body.className = (ph + keep).replace(/^\s+/, '');
  }

  function render() {
    var ms = remaining(), text, phase = '', nextText = '';
    var w = cfg.warnings;
    if (ms > 0) {
      var sec = Math.ceil(ms / 1000);
      text = fmt(sec);
      if (w.length && sec <= w[w.length - 1]) { phase = 'warn2'; } else if (w.length && sec <= w[0]) { phase = 'warn1'; }
      for (var i = 0; i < w.length; i++) { if (sec > w[i]) { nextText = 'Next tone at ' + fmt(w[i]); break; } }
      if (!nextText) { nextText = 'Final buzzer at 0:00'; }
    } else {
      var over = Math.floor(-ms / 1000);
      text = (running || ms < 0) ? '+' + fmt(over) : '0:00';
      phase = 'over' + ((running && Math.floor(-ms / 500) % 2 === 0) ? ' flash' : '');
      nextText = 'Time is up';
    }
    setTime(text);
    $('next').textContent = nextText;
    setPhase(phase);
  }

  // Plays each cue once, when its time is crossed. Cues more than 5 s overdue (e.g. a background
  // tab the browser had paused) are skipped rather than played late.
  function checkTones() {
    var sec = remaining() / 1000, w = cfg.warnings;
    for (var i = 0; i < w.length; i++) {
      if (!fired[w[i]] && sec <= w[i]) {
        fired[w[i]] = true;
        // Last warning gets the danger cue, earlier ones the warning cue.
        if (sec > w[i] - 5) { play(i === w.length - 1 && w.length > 1 ? 'danger' : 'warning'); }
      }
    }
    if (!fired.zero && sec <= 0) { fired.zero = true; if (sec > -5) { play('end'); } }
  }

  function tick() { checkTones(); render(); }

  /* ---------- control ---------- */
  function load(c, idx) {
    stop();
    cfg = { label: c.label, duration: c.duration, warnings: c.warnings.slice().sort(function (a, b) { return b - a; }) };
    presetIndex = idx;
    remainingMs = cfg.duration * 1000;
    fired = {};
    $('start').textContent = 'Start';
    $('label').textContent = cfg.label;
    for (var i = 0; i < 3; i++) { $('p' + (i + 1)).className = i === idx ? 'on' : ''; }
    $('pc').className = idx === -1 ? 'on' : '';
    store('last', JSON.stringify({ c: cfg, i: idx }));
    render();
    fitText();
  }

  function start() {
    unlockAudio();
    if (running) { return; }
    // Mark warnings already behind us so resuming doesn't replay them.
    var sec = remainingMs / 1000;
    for (var i = 0; i < cfg.warnings.length; i++) { if (sec < cfg.warnings[i]) { fired[cfg.warnings[i]] = true; } }
    if (remainingMs <= 0) { fired.zero = true; }
    endAt = now() + remainingMs;
    running = true;
    tickHandle = setInterval(tick, 100);
    $('start').textContent = 'Pause';
    requestWakeLock();
    tick();
  }

  function stop() {
    if (running) { remainingMs = endAt - now(); }
    running = false;
    clearInterval(tickHandle);
    $('start').textContent = remainingMs < cfg_duration_ms() ? 'Resume' : 'Start';
    releaseWakeLock();
  }

  function cfg_duration_ms() { return cfg ? cfg.duration * 1000 : 0; }

  function toggle() { if (running) { stop(); render(); } else { start(); } }

  function reset() { load(cfg, presetIndex); }

  function requestWakeLock() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }, function () { });
      }
    } catch (e) { }
  }
  function releaseWakeLock() { try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) { } }

  function toggleFullscreen() {
    var d = document, el = d.documentElement;
    var isFs = d.fullscreenElement || d.webkitFullscreenElement || d.msFullscreenElement;
    if (!isFs) {
      var r = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (r) { r.call(el); }
    } else {
      var x = d.exitFullscreen || d.webkitExitFullscreen || d.msExitFullscreen;
      if (x) { x.call(d); }
    }
  }

  function toggleHide() {
    if (body.className.indexOf('hide-controls') !== -1) { body.className = body.className.replace(/\s*hide-controls/, ''); } else { body.className += ' hide-controls'; }
    fitText();
  }

  function setMuted(m) {
    muted = m;
    $('mute').textContent = 'Sound: ' + (muted ? 'off' : 'on');
    store('muted', muted ? '1' : '0');
    updateAudioNote();
    updateDiag();
  }

  function applyCustom() {
    var d = parseTime($('cDur').value);
    if (!(d > 0)) { alert('Enter a duration like 3:00 or 180'); return; }
    var parts = $('cWarn').value.split(','), w = [], i;
    for (i = 0; i < parts.length; i++) {
      var t = parseTime(parts[i]);
      if (t > 0 && t < d) { w.push(t); }
    }
    var c = { label: $('cLabel').value || 'Custom', duration: d, warnings: w };
    store('custom', JSON.stringify(c));
    load(c, -1);
  }

  /* ---------- wiring ---------- */
  function on(el, ev, fn) { if (el.addEventListener) { el.addEventListener(ev, fn, false); } else { el.attachEvent('on' + ev, fn); } }

  for (var pi = 0; pi < 3; pi++) {
    (function (i) { on($('p' + (i + 1)), 'click', function () { load(PRESETS[i], i); }); })(pi);
  }
  on($('pc'), 'click', function () { var c = $('custom'); c.className = c.className === 'open' ? '' : 'open'; });
  on($('cApply'), 'click', applyCustom);
  on($('start'), 'click', toggle);
  on($('reset'), 'click', reset);
  on($('mute'), 'click', function () { setMuted(!muted); });
  // Test plays all three cues in order (about 6 s) so levels can be checked before pitches start.
  // It turns sound on first, so a passing test means the countdown will be heard too.
  on($('test'), 'click', function () { unlockAudio(); if (muted) { setMuted(false); } play('warning', 0); play('danger', 1.3); play('end', 2.3); });
  on($('vol'), 'input', function () { setVolume($('vol').value / 100); });
  on($('vol'), 'change', function () { setVolume($('vol').value / 100); $('vol').blur(); });
  on($('fs'), 'click', toggleFullscreen);
  on($('hide'), 'click', toggleHide);
  on(document, 'click', unlockAudio);
  on(document, 'touchend', unlockAudio);
  on(window, 'resize', fitText);
  on(document, 'visibilitychange', function () { if (!document.hidden && running) { requestWakeLock(); } });

  on(document, 'keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    var isRange = tag === 'INPUT' && e.target.type === 'range';
    if (tag === 'INPUT' && !isRange) { if (e.keyCode === 13) { applyCustom(); } return; }
    // The volume slider keeps its arrow keys; every other shortcut still works while it has focus.
    if (isRange && e.keyCode >= 37 && e.keyCode <= 40) { return; }
    unlockAudio();
    var k = e.keyCode;
    if (k === 32) { toggle(); } else if (k === 82) { reset(); } else if (k === 70) { toggleFullscreen(); } else if (k === 77) { setMuted(!muted); } else if (k === 72) { toggleHide(); } else if (k === 68) { var dg = $('diag'); dg.style.display = dg.style.display === 'none' ? 'block' : 'none'; updateDiag(); } else if (k >= 49 && k <= 51) { load(PRESETS[k - 49], k - 49); } else { return; }
    if (e.preventDefault) { e.preventDefault(); }
    if (document.activeElement && document.activeElement.blur) { document.activeElement.blur(); }
  });

  /* ---------- init ---------- */
  setMuted(store('muted') === '1');
  var savedVol = parseFloat(store('volume'));
  setVolume(isNaN(savedVol) ? 0.8 : savedVol);
  try {
    var cust = JSON.parse(store('custom') || 'null');
    if (cust) { $('cLabel').value = cust.label; $('cDur').value = fmt(cust.duration); var ws = []; for (var j = 0; j < cust.warnings.length; j++) { ws.push(fmt(cust.warnings[j])); } $('cWarn').value = ws.join(', '); }
  } catch (e) { }

  var q = window.location.search, qd = /[?&]d=(\d+)/.exec(q);
  if (qd) {
    var qw = /[?&]w=([\d,]+)/.exec(q), ql = /[?&]label=([^&]+)/.exec(q), wl = [];
    if (qw) { var a = qw[1].split(','); for (var x = 0; x < a.length; x++) { if (+a[x] > 0) { wl.push(+a[x]); } } }
    load({ label: ql ? decodeURIComponent(ql[1].replace(/\+/g, ' ')) : 'Timer', duration: +qd[1], warnings: wl }, -1);
  } else {
    var last = null;
    try { last = JSON.parse(store('last') || 'null'); } catch (e) { }
    if (last && last.c && last.c.duration > 0) { load(last.c, last.i); } else { load(PRESETS[1], 1); }
  }
})();
</script>
</body>
</html>
