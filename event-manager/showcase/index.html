<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>startup48 · Event Showcase</title>
<!--
  Self-running event loop: Meet the Organizers, Wi-Fi, Meet the Judges, the weekend schedule,
  Meet the Mentors, Thank you to our sponsors, and an announcement. People and text come from the operator console
  (api/showcase.php) and are re-read at the start of every loop. Empty slides are skipped.
  Keys: → next slide · Space pause/resume · F fullscreen
-->
<link rel="stylesheet" href="../assets/theme.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body { font-family: var(--s48-font); color: var(--s48-text); }
  body.idle { cursor: none; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--s48-bg); overflow: hidden; }

  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity .6s ease; }
  .slide.on { opacity: 1; }

  /* Header strip on every slide, like the printed deck: event line, a rule, and the logo. */
  .hdr { position: absolute; left: 140px; right: 140px; top: 54px; display: flex; align-items: center; gap: 28px; }
  .hdr .ev { font-family: var(--s48-font-heading); font-weight: 700; font-size: 24px; letter-spacing: .12em; text-transform: uppercase; color: var(--s48-muted); white-space: nowrap; }
  .hdr .rule { flex: 1; height: 2px; background: var(--s48-line); }
  .hdr .s48-wordmark { font-size: 34px; }
  .title { position: absolute; left: 140px; top: 112px; margin: 0; font-family: var(--s48-font-display); font-weight: 700; font-size: 72px; line-height: 1.1; }
  .title .k { color: var(--s48-accent-ink); }

  /* Meet slides: spotlight on the left, everyone else in a grid on the right. */
  .face { position: absolute; border-radius: 50%; overflow: hidden; background: var(--s48-surface-2); box-shadow: 0 0 0 4px var(--s48-bg); will-change: transform; transition: transform .9s cubic-bezier(.65, 0, .35, 1), opacity .5s ease; z-index: 1; }
  .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .face svg { display: block; }
  .face.out { z-index: 3; box-shadow: 0 0 0 8px var(--s48-bg), 0 0 0 14px var(--s48-accent); }
  .face.leaving { z-index: 2; }
  .face.hidden { opacity: 0; }
  .cap { position: absolute; left: 140px; width: 660px; top: 760px; text-align: center; opacity: 0; transition: opacity .5s ease; }
  .cap.on { opacity: 1; }
  .cap .nm { font-family: var(--s48-font-display); font-weight: 700; font-size: 52px; line-height: 1.15; }
  .cap .ln { font-size: 32px; line-height: 1.35; }
  .cap .org { color: var(--s48-muted); }
  .cap .sk { margin-top: 10px; font-size: 28px; color: var(--s48-accent-2); }
  .cap .days { margin-top: 14px; display: flex; gap: 10px; justify-content: center; }
  .cap .days span { font-family: var(--s48-font-heading); font-weight: 700; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; padding: 6px 14px; border-radius: 6px; background: var(--s48-teal); color: #fff; }
  .badge { position: absolute; right: 140px; top: 130px; font-family: var(--s48-font-heading); font-weight: 700; font-size: 26px; letter-spacing: .08em; text-transform: uppercase; padding: 10px 20px; border-radius: 8px; background: var(--s48-teal); color: #fff; }

  /* Info slides */
  .center { position: absolute; left: 140px; right: 140px; top: 260px; bottom: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 30px; }
  .wifi .row { font-size: 64px; } .wifi .row b { font-family: var(--s48-font-display); font-weight: 700; color: var(--s48-accent-2); }
  .ann .body { font-size: 54px; line-height: 1.35; max-width: 1400px; text-wrap: balance; }
  .sched { position: absolute; left: 140px; right: 140px; top: 250px; }
  .sched .schedule { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .sched .day { background: var(--s48-surface); border-radius: 16px; overflow: hidden; }
  .sched .day h3 { font-family: var(--s48-font-heading); font-weight: 700; font-size: 48px; margin: 0; padding: 18px 30px; color: #fff; font-variant-numeric: lining-nums; }
  .sched .day h3 .dayno { font-weight: 500; opacity: .85; margin-right: .45em; }
  .sched .day table { width: calc(100% - 60px); margin: 10px 30px 22px; border-collapse: collapse; }
  .sched .day td { font-size: 29px; padding: 8px 0; vertical-align: top; border-top: 1px solid var(--s48-line); }
  .sched .day tr:first-child td { border-top: 0; }
  .sched .day td:first-child { width: 142px; white-space: nowrap; padding-right: 16px; color: var(--s48-muted); font-variant-numeric: tabular-nums; }
  .sched .day.today { box-shadow: 0 0 0 4px var(--s48-accent-2); }
  /* Countdown to Final Pitches, under the schedule. */
  .until { position: absolute; left: 140px; right: 140px; top: 770px; text-align: center; }
  .until .lb { font-family: var(--s48-font-heading); font-weight: 700; font-size: 34px; letter-spacing: .14em; text-transform: uppercase; color: var(--s48-accent-ink); }
  .until .clock { font-family: var(--s48-font-display); font-weight: 700; font-size: 150px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .until .clock .d { display: inline-block; width: .64em; text-align: center; }
  .until .now { font-family: var(--s48-font-display); font-weight: 700; font-size: 84px; margin-top: 30px; }
  .c-orange { background: var(--s48-orange); } .c-teal { background: var(--s48-teal); } .c-slate { background: var(--s48-slate); }

  /* Sponsor logos (card styles are in theme.css), tiers grouped, shrunk to fit. */
  .spon { position: absolute; left: 140px; right: 140px; top: 270px; height: 720px; display: flex; align-items: center; justify-content: center; }

  #paused { position: absolute; right: 140px; bottom: 50px; font-size: 24px; color: var(--s48-muted); display: none; z-index: 10; }
  body.paused #paused { display: block; }
  @media (prefers-reduced-motion: reduce) { .face, .slide, .cap { transition-duration: .01s; } }
</style>
</head>
<body>
<div id="stage"><div id="paused">Paused · Space to resume</div></div>

<script src="../assets/common.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var GRID = { left: 860, top: 250, width: 920, height: 760 };   // where the grid of faces goes
  var SPOT = { cx: 470, cy: 500, size: 400 };                     // spotlight circle
  var FLY = 900;                                                  // ms for a face to fly out or back
  var data = null, scheduleHTML = null, step = 0, paused = false;   // step: id of the slide now showing
  var current = null, redo = false, at = null;   // slide on screen, whether to redraw it, who's in the spotlight

  function fit() { var s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = 'scale(' + s + ') translate(-50%, -50%)'; }
  fit(); addEventListener('resize', fit);

  // Sleep that respects pause and gives up when the slide has been skipped.
  function wait(ms, myRun) {
    return new Promise(function (resolve, reject) {
      var left = ms, last = Date.now();
      (function tick() {
        if (myRun !== step) { reject('skip'); return; }
        var now = Date.now(); if (!paused) { left -= now - last; } last = now;
        if (left <= 0) { resolve(); } else { setTimeout(tick, Math.min(100, left)); }
      })();
    });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (text !== undefined && text !== null) { e.textContent = text; } return e; }
  // Stand-in headshot for people without a photo: a head-and-shoulders silhouette on a colored
  // background, initials on the shirt. Colors come from the name, so each person keeps theirs.
  function avatarSVG(name) {
    var h = 0; for (var i = 0; i < name.length; i++) { h = (h * 31 + name.charCodeAt(i)) % 360; }
    var g = 'g' + Math.random().toString(36).slice(2), shirt = (h + 150) % 360;
    var ini = initials(name).replace(/[&<>"]/g, '');
    return '<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">' +
      '<defs><linearGradient id="' + g + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(' + h + ',30%,48%)"/><stop offset="1" stop-color="hsl(' + h + ',38%,66%)"/></linearGradient></defs>' +
      '<rect width="100" height="100" fill="url(#' + g + ')"/>' +
      '<ellipse cx="50" cy="40" rx="19" ry="23" fill="hsl(' + h + ',20%,88%)"/>' +
      '<ellipse cx="50" cy="100" rx="40" ry="32" fill="hsl(' + shirt + ',40%,24%)"/>' +
      '<text x="50" y="88" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="700" font-size="13" fill="#fff">' + ini + '</text></svg>';
  }
  function initials(n) { return n.split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join(''); }

  function frame(titleKicker, titleMain) {
    var s = el('section', 'slide');
    var h = el('div', 'hdr'); h.appendChild(el('div', 'ev', data && data.info.header || 'STARTUP 48'));
    h.appendChild(el('div', 'rule')); var w = el('div', 's48-wordmark'); w.innerHTML = 'startup<span>48</span>'; h.appendChild(w);
    s.appendChild(h);
    var t = el('h1', 'title'); if (titleKicker) { t.appendChild(el('span', 'k', titleKicker + ' ')); } t.appendChild(document.createTextNode(titleMain));
    s.appendChild(t);
    return s;
  }
  function swapIn(s) {
    var old = stage.querySelectorAll('.slide');
    stage.appendChild(s);
    requestAnimationFrame(function () { requestAnimationFrame(function () { s.classList.add('on'); }); });
    old.forEach(function (o) { o.classList.remove('on'); setTimeout(function () { o.remove(); }, 700); });
  }

  // Lay out n faces in the grid area: pick the column count that gives the biggest circles.
  function gridSlots(n) {
    var best = null;
    for (var cols = 1; cols <= n; cols++) {
      var rows = Math.ceil(n / cols), cell = Math.min(GRID.width / cols, GRID.height / rows, 230);
      if (!best || cell > best.cell) { best = { cols: cols, rows: rows, cell: cell }; }
    }
    var size = Math.round(best.cell * 0.84), slots = [];
    var offX = GRID.left + (GRID.width - best.cols * best.cell) + best.cell / 2;   // right-aligned like the video
    var offY = GRID.top + (GRID.height - best.rows * best.cell) / 2 + best.cell / 2;
    for (var i = 0; i < n; i++) { slots.push({ cx: offX + (i % best.cols) * best.cell, cy: offY + Math.floor(i / best.cols) * best.cell, size: size }); }
    return slots;
  }

  function captionFor(group, p) {
    var c = el('div', 'cap');
    c.appendChild(el('div', 'nm', p.name));
    if (p.title && group !== 'organizers') { c.appendChild(el('div', 'ln', p.title)); }
    if (p.org) { c.appendChild(el('div', 'ln org', p.org)); }
    if (group === 'organizers' && p.first_year) { c.appendChild(el('div', 'sk', 'First Startup 48: ' + p.first_year)); }
    if (group === 'mentors' && p.skills) { c.appendChild(el('div', 'sk', p.skills)); }
    if (group === 'mentors' && (p.sat || p.sun)) {
      var d = el('div', 'days'); if (p.sat) { d.appendChild(el('span', '', 'Saturday')); } if (p.sun) { d.appendChild(el('span', '', 'Sunday')); } c.appendChild(d);
    }
    return c;
  }

  function preload(urls) {
    return Promise.all(urls.map(function (u) { return new Promise(function (r) { var i = new Image(); i.onload = i.onerror = r; i.src = u; setTimeout(r, 4000); }); }));
  }

  async function meetSlide(group, title, people, badgeText, myRun, startId) {
    await preload(people.filter(function (p) { return p.photo_url; }).map(function (p) { return p.photo_url; }));
    var s = frame('Meet the', title), slots = gridSlots(people.length), faces = [];
    people.forEach(function (p, i) {
      var f = el('div', 'face hidden'), sl = slots[i];
      f.style.width = f.style.height = sl.size + 'px';
      f.style.left = (sl.cx - sl.size / 2) + 'px'; f.style.top = (sl.cy - sl.size / 2) + 'px';
      if (p.photo_url) { var im = el('img'); im.alt = ''; im.src = p.photo_url; f.appendChild(im); }
      else { f.innerHTML = avatarSVG(p.name); }
      s.appendChild(f); faces.push(f);
    });
    if (badgeText) { s.appendChild(el('div', 'badge', badgeText)); }
    swapIn(s);
    // Faces pop in one after another.
    for (var i = 0; i < faces.length; i++) { (function (f, d) { setTimeout(function () { f.classList.remove('hidden'); }, d); })(faces[i], 300 + i * 70); }
    await wait(900 + faces.length * 70, myRun);
    var cap = null, first = Math.max(0, people.findIndex(function (p) { return p.id === startId; }));
    for (i = first; i < people.length; i++) {
      at = people[i].id;
      var f = faces[i], sl = slots[i], k = SPOT.size / sl.size;
      f.classList.add('out');
      f.style.transform = 'translate(' + (SPOT.cx - sl.cx) + 'px,' + (SPOT.cy - sl.cy) + 'px) scale(' + k + ')';
      if (cap) { var oldCap = cap; oldCap.classList.remove('on'); setTimeout(function () { oldCap.remove(); }, 600); }
      cap = captionFor(group, people[i]); s.appendChild(cap);
      await wait(FLY * 0.6, myRun); cap.classList.add('on');
      await wait((data.info.seconds || 5) * 1000, myRun);
      // Send this face home; the next one flies out as it goes (as in the video).
      f.classList.remove('out'); f.classList.add('leaving'); f.style.transform = '';
      (function (ff) { setTimeout(function () { ff.classList.remove('leaving'); }, FLY); })(f);
    }
    if (cap) { cap.classList.remove('on'); }
    await wait(FLY + 600, myRun);
  }

  async function wifiSlide(myRun) {
    var s = frame('', 'Wi-Fi'), c = el('div', 'center wifi');
    var a = el('div', 'row'); a.appendChild(document.createTextNode('Network: ')); a.appendChild(el('b', '', data.info.wifi_name)); c.appendChild(a);
    if (data.info.wifi_pass) { var b = el('div', 'row'); b.appendChild(document.createTextNode('Password: ')); b.appendChild(el('b', '', data.info.wifi_pass)); c.appendChild(b); }
    s.appendChild(c); swapIn(s); await wait(10000, myRun);
  }
  // When "Final Pitches" starts, from the schedule: the next time its day and time come round on
  // this screen's clock. Null when the schedule has no such row.
  function finalPitchesAt() {
    var box = document.createElement('div'); box.innerHTML = scheduleHTML;
    var days = box.querySelectorAll('.day'), names = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
    for (var i = 0; i < days.length; i++) {
      var rows = days[i].querySelectorAll('tr');
      for (var j = 0; j < rows.length; j++) {
        var c = rows[j].querySelectorAll('td');
        if (c.length < 2 || !/final pitch/i.test(c[1].textContent)) { continue; }
        var h3 = days[i].querySelector('h3'), dow = -1, txt = h3 ? h3.textContent.toLowerCase() : '';
        names.forEach(function (n, k) { if (txt.indexOf(n) !== -1) { dow = k; } });
        var m = /(\d{1,2}):(\d{2})\s*([ap])\.?m/i.exec(c[0].textContent);
        if (dow < 0 || !m) { return null; }
        var hr = (+m[1] % 12) + (m[3].toLowerCase() === 'p' ? 12 : 0), now = new Date();
        var at = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hr, +m[2], 0);
        at.setDate(at.getDate() + (dow - now.getDay() + 7) % 7);
        return at;   // on the day itself this can be in the past: the pitches are underway
      }
    }
    return null;
  }
  function untilBlock() {
    var at = finalPitchesAt();
    if (!at) { return null; }
    var b = el('div', 'until');
    function draw() {
      var ms = at - new Date();
      b.textContent = '';
      if (ms <= 0) { b.appendChild(el('div', 'now', 'Final Pitches are underway!')); return; }
      var t = Math.floor(ms / 1000), two = function (n) { return ('0' + n).slice(-2); };
      b.appendChild(el('div', 'lb', 'Time Until Final Pitches'));
      var clock = el('div', 'clock');
      // One fixed-width slot per digit, so the clock doesn't shift sideways as the digits change.
      (two(Math.floor(t / 3600)) + ':' + two(Math.floor(t / 60) % 60) + ':' + two(t % 60)).split('').forEach(function (ch) {
        clock.appendChild(ch === ':' ? document.createTextNode(':') : el('span', 'd', ch));
      });
      b.appendChild(clock);
    }
    draw();
    b.timer = setInterval(draw, 250);
    return b;
  }

  async function scheduleSlide(myRun) {
    var s = frame('', 'The weekend at a glance'), box = el('div', 'sched');
    box.innerHTML = scheduleHTML;
    var dayIdx = { 5: 0, 6: 1, 0: 2 }[new Date().getDay()], days = box.querySelectorAll('.day');
    if (dayIdx !== undefined && days[dayIdx]) { days[dayIdx].classList.add('today'); }
    s.appendChild(box);
    if (data.info.mentor_hours) { s.appendChild(el('div', 'badge', data.info.mentor_hours)); }
    var until = untilBlock();
    if (until) { s.appendChild(until); }
    swapIn(s);
    try { await wait(15000, myRun); } finally { if (until) { clearInterval(until.timer); } }
  }
  // Thank-you slide: logos grouped by tier. More than SPONSORS_PER_PAGE logos split over several
  // pages, each shown for twice the per-person seconds (at least 8 s).
  var SPONSORS_PER_PAGE = 12;
  async function sponsorsSlide(myRun) {
    var pages = S48.sponsorPages(data.sponsors, SPONSORS_PER_PAGE), secs = Math.max(8, 2 * (data.info.seconds || 5));
    for (var p = 0; p < pages.length; p++) {
      // Load this page's logos first so they're already sized when the slide fades in.
      await preload(pages[p].filter(function (sp) { return sp.logo_url; }).map(function (sp) { return sp.logo_url; }));
      var s = frame('Thank you', 'to our sponsors'), wrap = el('div', 'spon'), box = el('div');
      box.style.width = '100%'; wrap.appendChild(box); s.appendChild(wrap);
      swapIn(s);
      await new Promise(function (r) { S48.showSponsors(box, pages[p], 720, r); });
      await wait(secs * 1000, myRun);
    }
  }
  async function announceSlide(myRun) {
    var s = frame('', data.info.announce_title), c = el('div', 'center ann');
    c.appendChild(el('div', 'body', data.info.announce_body)); s.appendChild(c); swapIn(s); await wait(10000, myRun);
  }
  async function emptySlide(msg, myRun) {
    var s = frame('', 'Event showcase'), c = el('div', 'center ann'); c.appendChild(el('div', 'body', msg)); s.appendChild(c); swapIn(s); await wait(10000, myRun);
  }

  function mentorsToday() {
    var mode = data.info.mentor_day || 'auto', d = new Date().getDay();
    if (mode === 'auto') { mode = d === 6 ? 'sat' : d === 0 ? 'sun' : 'all'; }
    // Organizers who also mentor follow the regular mentors.
    var all = data.people.mentors.concat(data.people.organizers.filter(function (p) { return p.mentoring; }));
    // Someone with no day ticked counts as both days rather than vanishing from the loop.
    var list = all.filter(function (p) { return mode === 'all' || p[mode] || (!p.sat && !p.sun); });
    return { list: list, label: mode === 'sat' ? 'Saturday mentors' : mode === 'sun' ? 'Sunday mentors' : '' };
  }

  async function load() {
    try {
      var r = await fetch('../api/showcase.php?_=' + Date.now(), { cache: 'no-store' });
      if (r.ok) { data = await r.json(); }
    } catch (e) { /* keep the last good data */ }
    if (scheduleHTML === null) {
      try {
        var html = await (await fetch('../slides/', { cache: 'no-store' })).text();
        var sch = new DOMParser().parseFromString(html, 'text/html').querySelector('[data-id="schedule"] .schedule');
        scheduleHTML = sch ? sch.outerHTML : '';
      } catch (e) { scheduleHTML = ''; }
    }
  }

  // The slides that have something to show right now, in loop order. sig captures everything a
  // slide displays, so a change to it can redraw that slide while it's on screen.
  function buildSteps() {
    if (!data) {
      return [{ key: 'empty', sig: 'offline', run: function (id) { return emptySlide('Can’t reach the showcase data. Retrying…', id); } }];
    }
    var P = data.people, m = mentorsToday(), i = data.info, steps = [];
    function add(key, inputs, run) { steps.push({ key: key, sig: JSON.stringify([i.header, i.seconds, inputs]), run: run }); }
    if (!P.organizers.length && !P.judges.length && !m.list.length) {
      add('empty', 0, function (id) { return emptySlide('Add organizers, judges and mentors in the operator console. They’ll appear here automatically.', id); });
    }
    if (P.organizers.length) { add('organizers', P.organizers, function (id, from) { return meetSlide('organizers', 'Organizers', P.organizers, '', id, from); }); }
    if (i.wifi_name) { add('wifi', [i.wifi_name, i.wifi_pass], wifiSlide); }
    if (P.judges.length) { add('judges', P.judges, function (id, from) { return meetSlide('judges', 'Judges', P.judges, '', id, from); }); }
    if (scheduleHTML) { add('schedule', i.mentor_hours, scheduleSlide); }
    if (m.list.length) {
      var t = m.label ? m.label.replace(' mentors', ' Mentors') : 'Mentors';
      add('mentors', [t, m.list, i.mentor_hours], function (id, from) { return meetSlide('mentors', t, m.list, i.mentor_hours, id, from); });
    }
    if (data.sponsors && data.sponsors.length) { add('sponsors', data.sponsors, sponsorsSlide); }
    if (i.announce_title && i.announce_body) { add('announce', [i.announce_title, i.announce_body], announceSlide); }
    return steps;
  }
  var ORDER = ['empty', 'organizers', 'wifi', 'judges', 'schedule', 'mentors', 'sponsors', 'announce'];

  // Re-read the data before every slide, then show the one after the last (or the same one again
  // when it was interrupted to redraw with new data).
  async function main() {
    var version = await deployedVersion(), newVersion = null;
    setInterval(async function () {   // a new deploy reloads the page at the next slide change
      var v = await deployedVersion(); if (v && version && v !== version) { newVersion = v; }
    }, 60000);
    setInterval(watch, 5000);
    for (;;) {
      if (newVersion) { location.replace(location.pathname + '?v=' + encodeURIComponent(newVersion)); return; }
      await load();
      var steps = buildSteps(), next = null, from = null;
      if (current && redo) {
        next = steps.find(function (st) { return st.key === current.key; });
        from = at;
      }
      if (!next) {
        var after = current ? ORDER.indexOf(current.key) : -1;
        next = steps.find(function (st) { return ORDER.indexOf(st.key) > after; }) || steps[0];
      }
      redo = false; at = null; current = next;
      try { await next.run(++step, from); } catch (e) {
        if (e !== 'skip') { console.error(e); await new Promise(function (r) { setTimeout(r, 3000); }); }   // a skip just moves on
      }
    }
  }

  // Every few seconds: if what's on screen changed in the console, redraw it in place.
  async function watch() {
    if (!current || redo) { return; }
    await load();
    var now = buildSteps().find(function (st) { return st.key === current.key; });
    if (!now || now.sig !== current.sig) { redo = true; step++; }
  }

  async function deployedVersion() {
    try {
      var r = await fetch('../version.json?_=' + Date.now(), { cache: 'no-store' });
      return r.ok ? (await r.json()).version || null : null;
    } catch (e) { return null; }
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { step++; }              // skip to the next slide
    else if (e.key === ' ') { paused = !paused; document.body.classList.toggle('paused', paused); }
    else if (e.key === 'f' || e.key === 'F') {
      var d = document, el2 = d.documentElement;
      if (!(d.fullscreenElement || d.webkitFullscreenElement)) { (el2.requestFullscreen || el2.webkitRequestFullscreen || function () {}).call(el2); }
      else { (d.exitFullscreen || d.webkitExitFullscreen || function () {}).call(d); }
    } else { return; }
    e.preventDefault();
  });
  var idleT; document.addEventListener('mousemove', function () { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function () { document.body.classList.add('idle'); }, 2500); });

  main();
})();
</script>
</body>
</html>
